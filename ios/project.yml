name: TalkBridge
options:
  bundleIdPrefix: com.talkbridge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: TalkBridge
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose a photo to personalize your TalkBridge background."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "TalkBridge uses speech recognition to translate spoken English and French."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "TalkBridge uses the microphone for spoken translation."
targets:
  TalkBridge:
    type: application
    platform: iOS
    sources:
      - TalkBridgeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talkbridge.ios
        PRODUCT_NAME: TalkBridge
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
